<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">相手のIPが分からないときは「ブロードキャスト」</text>

  <!-- Pico W broadcasting -->
  <rect x="320" y="55" width="140" height="70" rx="8" fill="#e0f2e9" stroke="#178a55" stroke-width="2.5"/>
  <text x="390" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#178a55">Pico W</text>
  <text x="390" y="108" text-anchor="middle" font-size="10" fill="#178a55">IPが毎回変わる…</text>

  <!-- broadcast fan-out -->
  <path d="M 390 125 L 150 220" stroke="#e0a52c" stroke-width="2" fill="none" marker-end="url(#b1)"/>
  <path d="M 390 125 L 390 220" stroke="#e0a52c" stroke-width="2" fill="none" marker-end="url(#b1)"/>
  <path d="M 390 125 L 630 220" stroke="#e0a52c" stroke-width="2" fill="none" marker-end="url(#b1)"/>
  <text x="390" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#8a6a12">255.255.255.255へブロードキャスト</text>
  <text x="390" y="162" text-anchor="middle" font-size="10.5" fill="#8a6a12">「だれかいますか」(全員に送る)</text>

  <!-- three listeners -->
  <rect x="80" y="225" width="140" height="60" rx="6" fill="#f1f3f6" stroke="#98a0ad" stroke-width="1.5"/>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#586070">別の機器</text>
  <text x="150" y="268" text-anchor="middle" font-size="10" fill="#586070">(聞いていない)</text>

  <rect x="320" y="225" width="140" height="60" rx="6" fill="#e4ebfb" stroke="#3860c6" stroke-width="2.5"/>
  <text x="390" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#3860c6">自分のPC</text>
  <text x="390" y="268" text-anchor="middle" font-size="10" fill="#3860c6">0.0.0.0で待ち受け中</text>

  <rect x="560" y="225" width="140" height="60" rx="6" fill="#f1f3f6" stroke="#98a0ad" stroke-width="1.5"/>
  <text x="630" y="252" text-anchor="middle" font-size="11" fill="#586070">別の機器</text>
  <text x="630" y="268" text-anchor="middle" font-size="10" fill="#586070">(聞いていない)</text>

  <!-- reply -->
  <path d="M 390 285 L 390 340" stroke="#3860c6" stroke-width="2.2" fill="none" marker-end="url(#b2)"/>
  <text x="500" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#3860c6">受け取ったaddr(送信元のIP:ポート)へ</text>
  <text x="500" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#3860c6">個別に返事する</text>

  <rect x="320" y="345" width="140" height="55" rx="8" fill="#e0f2e9" stroke="#178a55" stroke-width="2.5"/>
  <text x="390" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#178a55">Pico W</text>
  <text x="390" y="384" text-anchor="middle" font-size="10" fill="#178a55">「PCから返事が来た!」</text>

  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a52c"/></marker>
    <marker id="b2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3860c6"/></marker>
  </defs>
</svg>
