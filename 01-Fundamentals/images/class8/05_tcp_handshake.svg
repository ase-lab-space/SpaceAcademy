<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">TCPのハンドシェイク(3回のやり取りで握手する)</text>

  <!-- lifelines -->
  <text x="120" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#3860c6">クライアント(PC)</text>
  <line x1="120" y1="65" x2="120" y2="340" stroke="#3860c6" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="520" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#178a55">サーバー(Pico Wなど)</text>
  <line x1="520" y1="65" x2="520" y2="340" stroke="#178a55" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- SYN -->
  <path d="M 120 100 L 520 100" stroke="#c1443d" stroke-width="2.2" fill="none" marker-end="url(#h1)"/>
  <rect x="230" y="78" width="180" height="24" rx="4" fill="#fbeaea"/>
  <text x="320" y="95" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c1443d">① SYN「話しかけていい?」</text>

  <!-- SYN-ACK -->
  <path d="M 520 150 L 120 150" stroke="#e0a52c" stroke-width="2.2" fill="none" marker-end="url(#h2)"/>
  <rect x="200" y="128" width="240" height="24" rx="4" fill="#fdf3e0"/>
  <text x="320" y="145" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a6a12">② SYN+ACK「いいよ、こっちも話したい」</text>

  <!-- ACK -->
  <path d="M 120 200 L 520 200" stroke="#178a55" stroke-width="2.2" fill="none" marker-end="url(#h3)"/>
  <rect x="230" y="178" width="180" height="24" rx="4" fill="#e0f2e9"/>
  <text x="320" y="195" text-anchor="middle" font-size="11.5" font-weight="700" fill="#178a55">③ ACK「了解、始めよう」</text>

  <!-- connection established -->
  <rect x="180" y="225" width="280" height="30" rx="6" fill="#ebe4f8" stroke="#6a4dbd" stroke-width="1.5"/>
  <text x="320" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#6a4dbd">接続確立!ここからデータのやり取り</text>

  <!-- data + ack -->
  <path d="M 120 280 L 520 280" stroke="#3860c6" stroke-width="2" fill="none" marker-end="url(#h4)"/>
  <text x="320" y="273" text-anchor="middle" font-size="10.5" fill="#3860c6">データ送信</text>
  <path d="M 520 310 L 120 310" stroke="#3860c6" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#h4)"/>
  <text x="320" y="303" text-anchor="middle" font-size="10" fill="#3860c6">「届いたよ」の確認(ACK)が裏で毎回やり取りされる</text>

  <defs>
    <marker id="h1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c1443d"/></marker>
    <marker id="h2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a52c"/></marker>
    <marker id="h3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#178a55"/></marker>
    <marker id="h4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3860c6"/></marker>
  </defs>

  <text x="320" y="365" text-anchor="middle" font-size="11.5" fill="#586070">UDPはこの①〜③を一切せず、いきなりデータを送りつける(だから速いが、届いた保証がない)</text>
</svg>
