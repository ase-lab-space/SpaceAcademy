<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="700" height="260" fill="#f1f3f6" rx="12"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1e25">今日のゴール:UDPとTCP、2つの話し方でメッセージを送る</text>

  <!-- PC -->
  <rect x="40" y="90" width="130" height="80" rx="8" fill="#e4ebfb" stroke="#3860c6" stroke-width="2.5"/>
  <text x="105" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#3860c6">自分のPC</text>

  <!-- Wifi router icon -->
  <g>
    <rect x="300" y="55" width="100" height="36" rx="6" fill="#ebe4f8" stroke="#6a4dbd" stroke-width="2"/>
    <text x="350" y="78" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6a4dbd">自宅のWi-Fi</text>
    <path d="M320 55 q30 -25 60 0" stroke="#6a4dbd" stroke-width="2" fill="none"/>
    <path d="M330 55 q20 -15 40 0" stroke="#6a4dbd" stroke-width="2" fill="none"/>
  </g>

  <!-- Pico W -->
  <rect x="530" y="90" width="130" height="80" rx="8" fill="#e0f2e9" stroke="#178a55" stroke-width="2.5"/>
  <text x="595" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#178a55">Pico W</text>

  <!-- connecting lines -->
  <path d="M 170 130 L 300 90" stroke="#586070" stroke-width="1.8" fill="none" stroke-dasharray="4 4"/>
  <path d="M 400 90 L 530 130" stroke="#586070" stroke-width="1.8" fill="none" stroke-dasharray="4 4"/>

  <!-- UDP arrow -->
  <path d="M 400 150 L 170 150" stroke="#e0a52c" stroke-width="2.5" fill="none" marker-end="url(#u1)"/>
  <text x="285" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#8a6a12">UDP「送りっぱなし」</text>

  <!-- TCP arrow -->
  <path d="M 170 200 L 660 200" stroke="#c1443d" stroke-width="2.5" fill="none" marker-end="url(#u2)"/>
  <path d="M 660 210 L 170 210" stroke="#c1443d" stroke-width="2.5" fill="none" marker-end="url(#u2)"/>
  <text x="415" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#c1443d">TCP「確認しながら」やり取り</text>

  <defs>
    <marker id="u1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a52c"/></marker>
    <marker id="u2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c1443d"/></marker>
  </defs>

  <text x="350" y="240" text-anchor="middle" font-size="12.5" fill="#586070">PCの中だけの実験→マイコン→PC→ブロードキャスト→TCP、の順で手を動かします</text>
</svg>
