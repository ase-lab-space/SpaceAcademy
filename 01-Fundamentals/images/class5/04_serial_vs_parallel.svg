<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>

  <!-- Parallel (top) -->
  <text x="30" y="35" font-size="15" font-weight="700" fill="#b23a3a">パラレル通信</text>
  <rect x="30" y="45" width="70" height="46" fill="#f6ecda" stroke="#1b1e25" stroke-width="2"/>
  <text x="65" y="72" text-anchor="middle" font-size="12" fill="#1b1e25">送信側</text>
  <rect x="480" y="45" width="70" height="46" fill="#f6ecda" stroke="#1b1e25" stroke-width="2"/>
  <text x="515" y="72" text-anchor="middle" font-size="12" fill="#1b1e25">受信側</text>

  <!-- 8 parallel wires, each carrying one bit simultaneously -->
  <g font-size="11" fill="#b23a3a" font-family="ui-monospace, Consolas, monospace">
    <line x1="100" y1="50" x2="480" y2="50" stroke="#b23a3a" stroke-width="2"/>
    <text x="290" y="47" text-anchor="middle">bit7 = 0</text>
    <line x1="100" y1="58" x2="480" y2="58" stroke="#b23a3a" stroke-width="2"/>
    <text x="290" y="55" text-anchor="middle" font-size="0"></text>
    <line x1="100" y1="66" x2="480" y2="66" stroke="#b23a3a" stroke-width="2"/>
    <line x1="100" y1="74" x2="480" y2="74" stroke="#b23a3a" stroke-width="2"/>
    <line x1="100" y1="82" x2="480" y2="82" stroke="#b23a3a" stroke-width="2"/>
    <line x1="100" y1="90" x2="480" y2="90" stroke="#b23a3a" stroke-width="2"/>
  </g>
  <text x="290" y="105" text-anchor="middle" font-size="12" fill="#b23a3a" font-weight="700">8本の線で8bitを同時に送る(配線が多い)</text>
  <text x="290" y="122" text-anchor="middle" font-size="12" fill="#178a55" font-weight="700">→ 1回で送れるので速い</text>

  <!-- divider -->
  <line x1="20" y1="150" x2="620" y2="150" stroke="#d8dde4" stroke-width="1.5"/>

  <!-- Serial (bottom) -->
  <text x="30" y="180" font-size="15" font-weight="700" fill="#3860c6">シリアル通信(UARTなど)</text>
  <rect x="30" y="190" width="70" height="46" fill="#e4ebfb" stroke="#1b1e25" stroke-width="2"/>
  <text x="65" y="217" text-anchor="middle" font-size="12" fill="#1b1e25">送信側</text>
  <rect x="480" y="190" width="70" height="46" fill="#e4ebfb" stroke="#1b1e25" stroke-width="2"/>
  <text x="515" y="217" text-anchor="middle" font-size="12" fill="#1b1e25">受信側</text>

  <line x1="100" y1="213" x2="480" y2="213" stroke="#3860c6" stroke-width="2.5"/>

  <!-- bits traveling one after another over time, shown as a sequence -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#3860c6" font-weight="700">
    <rect x="150" y="200" width="34" height="26" fill="#ffffff" stroke="#3860c6" stroke-width="1.5"/>
    <text x="167" y="217" text-anchor="middle">1</text>
    <rect x="220" y="200" width="34" height="26" fill="#ffffff" stroke="#3860c6" stroke-width="1.5"/>
    <text x="237" y="217" text-anchor="middle">0</text>
    <rect x="290" y="200" width="34" height="26" fill="#ffffff" stroke="#3860c6" stroke-width="1.5"/>
    <text x="307" y="217" text-anchor="middle">0</text>
    <rect x="360" y="200" width="34" height="26" fill="#ffffff" stroke="#3860c6" stroke-width="1.5"/>
    <text x="377" y="217" text-anchor="middle">0</text>
    <text x="420" y="217" text-anchor="middle" fill="#98a0ad">…</text>
  </g>
  <text x="290" y="250" text-anchor="middle" font-size="12" fill="#3860c6" font-weight="700">1本の線で1bitずつ順番に送る(配線が少ない)</text>
  <text x="290" y="267" text-anchor="middle" font-size="12" fill="#b9860f" font-weight="700">→ 送るのに時間がかかるが、配線がシンプル</text>

  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#1b1e25" font-weight="700">マイコン同士では、配線の少なさが有利なシリアル通信が広く使われる</text>
</svg>
