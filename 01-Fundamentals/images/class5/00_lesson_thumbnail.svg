<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <defs>
    <marker id="thumbArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#178a55"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="260" fill="#f1f3f6" rx="12"/>

  <!-- Board A -->
  <rect x="60" y="90" width="150" height="90" rx="10" fill="#e0f2e9" stroke="#178a55" stroke-width="2.5"/>
  <text x="135" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#178a55">Pico W</text>
  <text x="135" y="160" text-anchor="middle" font-size="12" fill="#178a55">(送信)</text>

  <!-- Board B -->
  <rect x="430" y="90" width="150" height="90" rx="10" fill="#e4ebfb" stroke="#3860c6" stroke-width="2.5"/>
  <text x="505" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#3860c6">Pico W</text>
  <text x="505" y="160" text-anchor="middle" font-size="12" fill="#3860c6">(受信)</text>

  <!-- message bubble flowing -->
  <path d="M 210 125 L 420 125" stroke="#178a55" stroke-width="2.5" marker-end="url(#thumbArrow)" fill="none"/>
  <rect x="255" y="55" width="130" height="42" rx="10" fill="#ffffff" stroke="#178a55" stroke-width="2"/>
  <text x="320" y="82" text-anchor="middle" font-size="15" font-family="ui-monospace, Consolas, monospace" font-weight="700" fill="#1b1e25">"PING 3"</text>

  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1e25">今日のゴール:2台のマイコンをUARTでおしゃべりさせる</text>
  <text x="320" y="225" text-anchor="middle" font-size="13" fill="#586070">1本のケーブルで、離れた基板どうしがメッセージをやり取りする</text>
</svg>
