<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="620" height="300" fill="#ffffff"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">「せーの」の合図(スタートビット)＋同じテンポ(ボーレート)の約束</text>

  <!-- sender row -->
  <text x="30" y="90" font-size="13" font-weight="700" fill="#178a55">送信側</text>
  <line x1="90" y1="90" x2="580" y2="90" stroke="#d8dde4" stroke-width="2"/>
  <circle cx="90" cy="90" r="7" fill="#b23a3a"/>
  <text x="90" y="70" text-anchor="middle" font-size="12" fill="#b23a3a" font-weight="700">せーの!</text>
  <!-- ticks on sender, evenly spaced, matching agreed tempo -->
  <circle cx="160" cy="90" r="5" fill="#178a55"/>
  <circle cx="230" cy="90" r="5" fill="#178a55"/>
  <circle cx="300" cy="90" r="5" fill="#178a55"/>
  <circle cx="370" cy="90" r="5" fill="#178a55"/>
  <circle cx="440" cy="90" r="5" fill="#178a55"/>
  <circle cx="510" cy="90" r="5" fill="#178a55"/>

  <!-- vertical dashed sync line at start -->
  <line x1="90" y1="90" x2="90" y2="210" stroke="#b23a3a" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- no connecting line between rows elsewhere -->
  <text x="310" y="150" text-anchor="middle" font-size="12" fill="#98a0ad" font-style="italic">(この間、2人をつなぐ線は無い。それぞれが自分のテンポで数えるだけ)</text>

  <!-- receiver row -->
  <text x="30" y="210" font-size="13" font-weight="700" fill="#3860c6">受信側</text>
  <line x1="90" y1="210" x2="580" y2="210" stroke="#d8dde4" stroke-width="2"/>
  <circle cx="90" cy="210" r="7" fill="#b23a3a"/>
  <circle cx="160" cy="210" r="5" fill="#3860c6"/>
  <circle cx="230" cy="210" r="5" fill="#3860c6"/>
  <circle cx="300" cy="210" r="5" fill="#3860c6"/>
  <circle cx="370" cy="210" r="5" fill="#3860c6"/>
  <circle cx="440" cy="210" r="5" fill="#3860c6"/>
  <circle cx="510" cy="210" r="5" fill="#3860c6"/>

  <text x="160" y="235" text-anchor="middle" font-size="11" fill="#586070">1歩目</text>
  <text x="230" y="235" text-anchor="middle" font-size="11" fill="#586070">2歩目</text>
  <text x="300" y="235" text-anchor="middle" font-size="11" fill="#586070">3歩目</text>
  <text x="370" y="235" text-anchor="middle" font-size="11" fill="#586070">4歩目</text>
  <text x="440" y="235" text-anchor="middle" font-size="11" fill="#586070">5歩目</text>
  <text x="510" y="235" text-anchor="middle" font-size="11" fill="#586070">6歩目</text>

  <text x="310" y="270" text-anchor="middle" font-size="12.5" fill="#1b1e25">スタートビット(せーの)の瞬間だけ足並みを揃え、あとは事前に約束した同じ歩幅(ボーレート)で数える</text>
  <text x="310" y="290" text-anchor="middle" font-size="12.5" fill="#1b1e25">→ 常に合図を送り続ける線(クロック)が無くても、タイミングはズレない</text>
</svg>
