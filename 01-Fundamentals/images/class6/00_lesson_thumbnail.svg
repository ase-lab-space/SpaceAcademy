<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="640" height="260" fill="#f1f3f6" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1e25">今日のゴール:繰り返しを「関数」「ライブラリ」にまとめる</text>

  <!-- left: messy repeated code -->
  <g>
    <rect x="30" y="55" width="150" height="34" rx="5" fill="#f8f0dc" stroke="#b9860f" stroke-width="1.5"/>
    <text x="105" y="76" text-anchor="middle" font-size="10.5" fill="#8a6a12" font-family="monospace">led.value(1)...sleep(0.3)</text>
    <rect x="40" y="93" width="150" height="34" rx="5" fill="#f8f0dc" stroke="#b9860f" stroke-width="1.5"/>
    <text x="115" y="114" text-anchor="middle" font-size="10.5" fill="#8a6a12" font-family="monospace">led.value(1)...sleep(0.3)</text>
    <rect x="50" y="131" width="150" height="34" rx="5" fill="#f8f0dc" stroke="#b9860f" stroke-width="1.5"/>
    <text x="125" y="152" text-anchor="middle" font-size="10.5" fill="#8a6a12" font-family="monospace">led.value(1)...sleep(0.3)</text>
    <text x="105" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#b9860f">コピペを繰り返す…</text>
  </g>

  <path d="M 210 130 L 260 130" stroke="#586070" stroke-width="2.5" fill="none" marker-end="url(#a0)"/>
  <text x="235" y="120" text-anchor="middle" font-size="10.5" fill="#586070">まとめる</text>

  <!-- center: function box -->
  <g>
    <rect x="265" y="90" width="150" height="80" rx="8" fill="#e0f2e9" stroke="#178a55" stroke-width="2.5"/>
    <text x="340" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#178a55" font-family="monospace">def blink_led():</text>
    <text x="340" y="140" text-anchor="middle" font-size="10.5" fill="#178a55">1回定義して</text>
    <text x="340" y="156" text-anchor="middle" font-size="10.5" fill="#178a55">何度でも呼び出す</text>
  </g>

  <path d="M 425 130 L 475 130" stroke="#586070" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="450" y="120" text-anchor="middle" font-size="10.5" fill="#586070">分ける</text>

  <!-- right: library file -->
  <g>
    <path d="M 485 90 h 100 a 8 8 0 0 1 8 8 v 64 a 8 8 0 0 1 -8 8 h -100 a 8 8 0 0 1 -8 -8 v -64 a 8 8 0 0 1 8 -8 z" fill="#e4ebfb" stroke="#3860c6" stroke-width="2.5"/>
    <text x="535" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3860c6" font-family="monospace">led_utils.py</text>
    <text x="535" y="140" text-anchor="middle" font-size="10.5" fill="#3860c6">= ライブラリ</text>
    <text x="535" y="156" text-anchor="middle" font-size="10.5" fill="#3860c6">import して使う</text>
  </g>

  <defs>
    <marker id="a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586070"/></marker>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586070"/></marker>
  </defs>

  <text x="320" y="230" text-anchor="middle" font-size="12.5" fill="#586070">今日の道具はいつものLED点滅だけ。中身の「書き方」を見直す回です</text>
</svg>
