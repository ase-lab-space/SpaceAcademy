<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="640" height="260" fill="#f1f3f6" rx="12"/>

  <!-- Pico W -->
  <rect x="50" y="100" width="140" height="80" rx="8" fill="#e4ebfb" stroke="#3860c6" stroke-width="2.5"/>
  <text x="120" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#3860c6">Pico W</text>

  <!-- BME280 -->
  <rect x="450" y="100" width="140" height="80" rx="8" fill="#e0f2e9" stroke="#178a55" stroke-width="2.5"/>
  <text x="520" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#178a55">BME280</text>
  <text x="520" y="158" text-anchor="middle" font-size="11" fill="#178a55">温湿度・気圧センサ</text>

  <!-- exchange arrows -->
  <path d="M 190 130 L 450 130" stroke="#178a55" stroke-width="2.2" fill="none" marker-end="url(#a1)"/>
  <path d="M 450 155 L 190 155" stroke="#3860c6" stroke-width="2.2" fill="none" marker-end="url(#a2)"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#178a55"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3860c6"/></marker>
  </defs>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#178a55">「気温は?」(SPI→I2Cの2通りで聞く)</text>
  <text x="320" y="172" text-anchor="middle" font-size="11" fill="#3860c6">「24.3℃です」(レジスタから読み出し)</text>

  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1e25">今日のゴール:センサと会話する(SPI→I2C)</text>
  <text x="320" y="225" text-anchor="middle" font-size="12.5" fill="#586070">前回はマイコン同士。今日はマイコンとセンサが「レジスタ」を介して会話する</text>
</svg>
