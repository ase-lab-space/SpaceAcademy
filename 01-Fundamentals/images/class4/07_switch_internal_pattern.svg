<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="520" height="320" fill="#ffffff"/>

  <!-- switch body top-down -->
  <rect x="180" y="90" width="160" height="140" rx="10" fill="#f6ecda" stroke="#1b1e25" stroke-width="2.5"/>
  <circle cx="260" cy="160" r="34" fill="#eef2f8" stroke="#1b1e25" stroke-width="2"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#586070">ボタン</text>

  <!-- 4 legs at corners -->
  <circle cx="180" cy="110" r="7" fill="#1b1e25"/>
  <text x="150" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">A</text>

  <circle cx="180" cy="210" r="7" fill="#1b1e25"/>
  <text x="150" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">B</text>

  <circle cx="340" cy="110" r="7" fill="#1b1e25"/>
  <text x="370" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">C</text>

  <circle cx="340" cy="210" r="7" fill="#1b1e25"/>
  <text x="370" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">D</text>

  <!-- always-connected pairs: A-B (left), C-D (right), drawn as solid lines outside body -->
  <path d="M 180 110 C 130 110, 130 210, 180 210" fill="none" stroke="#178a55" stroke-width="3"/>
  <path d="M 340 110 C 390 110, 390 210, 340 210" fill="none" stroke="#178a55" stroke-width="3"/>
  <text x="95" y="163" text-anchor="middle" font-size="12" fill="#178a55" font-weight="700">常に<tspan x="95" dy="15">導通</tspan></text>
  <text x="425" y="163" text-anchor="middle" font-size="12" fill="#178a55" font-weight="700">常に<tspan x="425" dy="15">導通</tspan></text>

  <!-- gap between left pair and right pair, bridged on press -->
  <line x1="214" y1="160" x2="226" y2="160" stroke="#b23a3a" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="294" y1="160" x2="306" y2="160" stroke="#b23a3a" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="260" y="270" text-anchor="middle" font-size="14" fill="#b23a3a" font-weight="700">ボタンを押すと、この2箇所が繋がる</text>
  <text x="260" y="292" text-anchor="middle" font-size="13" fill="#586070">→ A・B・C・D の4本すべてが1つの回路になる</text>

  <text x="260" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">タクトスイッチの内部導通パターン(上から見た図)</text>
</svg>
