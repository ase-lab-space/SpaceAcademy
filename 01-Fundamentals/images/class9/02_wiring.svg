<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">Pico W ⇔ LoRaモジュール(E220-900T22S(JP))の配線</text>

  <!-- Pico W -->
  <rect x="50" y="70" width="160" height="240" rx="8" fill="#e4ebfb" stroke="#3860c6" stroke-width="2.5"/>
  <text x="130" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#3860c6">Pico W</text>

  <g font-size="11" fill="#3860c6">
    <text x="70" y="130">GP0(TX)</text>
    <text x="70" y="160">GP1(RX)</text>
    <text x="70" y="190">3V3</text>
    <text x="70" y="220">GND</text>
  </g>

  <!-- LoRa module -->
  <rect x="470" y="70" width="160" height="240" rx="8" fill="#ebe4f8" stroke="#6a4dbd" stroke-width="2.5"/>
  <text x="550" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#6a4dbd">LoRaモジュール</text>

  <g font-size="11" fill="#6a4dbd">
    <text x="490" y="130">RXD</text>
    <text x="490" y="160">TXD</text>
    <text x="490" y="190">VCC</text>
    <text x="490" y="220">GND</text>
    <text x="490" y="250">M0</text>
    <text x="490" y="280">M1</text>
  </g>

  <!-- crossing TX/RX lines -->
  <path d="M 150 126 L 530 156" stroke="#c1443d" stroke-width="2" fill="none"/>
  <text x="340" y="132" text-anchor="middle" font-size="10.5" fill="#c1443d">TX → RXD(クロス)</text>

  <path d="M 150 156 L 530 126" stroke="#178a55" stroke-width="2" fill="none"/>
  <text x="340" y="158" text-anchor="middle" font-size="10.5" fill="#178a55">RX ← TXD(クロス)</text>

  <!-- power lines -->
  <path d="M 150 186 L 530 186" stroke="#e0a52c" stroke-width="2" fill="none"/>
  <text x="340" y="182" text-anchor="middle" font-size="10.5" fill="#8a6a12">3V3 → VCC</text>

  <path d="M 150 216 L 530 216" stroke="#586070" stroke-width="2" fill="none"/>
  <text x="340" y="212" text-anchor="middle" font-size="10.5" fill="#586070">GND ↔ GND(共通の基準)</text>

  <!-- M0/M1 to GND -->
  <path d="M 565 246 L 610 246 L 610 355 L 220 355 L 220 216" stroke="#586070" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
  <path d="M 565 276 L 630 276 L 630 355" stroke="#586070" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
  <text x="340" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#586070">M0・M1はどちらもGNDへ(Mode 0 = 通常送受信モードにする)</text>

  <rect x="50" y="375" width="580" height="30" rx="6" fill="#fbeaea"/>
  <text x="340" y="395" text-anchor="middle" font-size="11" fill="#c1443d">⚠️ アンテナ(ANT)を付けずに送信すると、モジュールを傷める可能性があります</text>
</svg>
