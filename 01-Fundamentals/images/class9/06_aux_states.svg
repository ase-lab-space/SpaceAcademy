<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">AUXピンが教えてくれる、モジュールの今の状態</text>

  <!-- HIGH state -->
  <rect x="60" y="60" width="230" height="110" rx="10" fill="#e0f2e9" stroke="#178a55" stroke-width="2.5"/>
  <text x="175" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#178a55">AUX = HIGH(1)</text>
  <text x="175" y="112" text-anchor="middle" font-size="12" fill="#178a55">アイドル状態</text>
  <text x="175" y="132" text-anchor="middle" font-size="11" fill="#178a55">送信・設定コマンドを</text>
  <text x="175" y="148" text-anchor="middle" font-size="11" fill="#178a55">受け付けてOK</text>

  <!-- LOW state -->
  <rect x="430" y="60" width="230" height="110" rx="10" fill="#fbeaea" stroke="#c1443d" stroke-width="2.5"/>
  <text x="545" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#c1443d">AUX = LOW(0)</text>
  <text x="545" y="112" text-anchor="middle" font-size="12" fill="#c1443d">ビジー状態</text>
  <text x="545" y="132" text-anchor="middle" font-size="11" fill="#c1443d">送信中・休止時間中・</text>
  <text x="545" y="148" text-anchor="middle" font-size="11" fill="#c1443d">受信データ転送中 など</text>

  <!-- arrows between states -->
  <path d="M 295 100 L 425 100" stroke="#586070" stroke-width="2.2" fill="none" marker-end="url(#s1)"/>
  <text x="360" y="90" text-anchor="middle" font-size="10.5" fill="#586070">UART送信を始めると</text>

  <path d="M 425 140 L 295 140" stroke="#586070" stroke-width="2.2" fill="none" marker-end="url(#s2)"/>
  <text x="360" y="160" text-anchor="middle" font-size="10.5" fill="#586070">送信+休止時間が終わると</text>

  <!-- timeline below -->
  <text x="360" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1e25">実際のタイムライン(1回の送信の様子)</text>

  <line x1="60" y1="250" x2="660" y2="250" stroke="#c7ccd4" stroke-width="1.5"/>

  <rect x="60" y="235" width="120" height="30" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
  <text x="120" y="255" text-anchor="middle" font-size="10" fill="#178a55">HIGH(待機中)</text>

  <rect x="180" y="235" width="220" height="30" fill="#fbeaea" stroke="#c1443d" stroke-width="1.5"/>
  <text x="290" y="255" text-anchor="middle" font-size="10" fill="#c1443d">LOW(送信+休止時間)</text>

  <rect x="400" y="235" width="260" height="30" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
  <text x="530" y="255" text-anchor="middle" font-size="10" fill="#178a55">HIGH(次の送信までの待機中)</text>

  <path d="M 180 220 L 180 235" stroke="#1b1e25" stroke-width="1.5" fill="none"/>
  <text x="180" y="212" text-anchor="middle" font-size="10" fill="#1b1e25">uart.write()した瞬間</text>

  <rect x="90" y="280" width="540" height="30" rx="6" fill="#f1f3f6"/>
  <text x="360" y="300" text-anchor="middle" font-size="11" fill="#586070">送信前に必ずAUX=HIGHを確認する。LOWの間に書き込むと、無視・欠損・混乱の原因になる</text>

  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586070"/></marker>
    <marker id="s2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586070"/></marker>
  </defs>
</svg>
