<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">ビットシフトによる気温データの取得</text>

  <!-- vertical guide lines marking 8bit / 8bit / 4bit boundaries -->
  <line x1="330" y1="55" x2="330" y2="560" stroke="#a8d9bf" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="570" y1="55" x2="570" y2="560" stroke="#a8d9bf" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- helper to draw a row of 8 bit boxes -->
  <!-- Row 1: msb -->
  <g>
    <text x="40" y="95" font-size="13" font-weight="700" fill="#178a55">msb</text>
    <g id="row-msb">
      <rect x="70" y="70" width="32" height="32" fill="#ffffff" stroke="#178a55" stroke-width="2"/>
      <rect x="104" y="70" width="32" height="32" fill="#ffffff" stroke="#178a55" stroke-width="2"/>
      <rect x="138" y="70" width="32" height="32" fill="#ffffff" stroke="#178a55" stroke-width="2"/>
      <rect x="172" y="70" width="32" height="32" fill="#ffffff" stroke="#178a55" stroke-width="2"/>
      <rect x="206" y="70" width="32" height="32" fill="#ffffff" stroke="#178a55" stroke-width="2"/>
      <rect x="240" y="70" width="32" height="32" fill="#ffffff" stroke="#178a55" stroke-width="2"/>
      <rect x="274" y="70" width="32" height="32" fill="#ffffff" stroke="#178a55" stroke-width="2"/>
      <rect x="308" y="70" width="32" height="32" fill="#ffffff" stroke="#178a55" stroke-width="2"/>
    </g>
    <g font-size="9.5" fill="#586070" text-anchor="middle">
      <text x="86" y="115">7bit</text><text x="120" y="115">6bit</text><text x="154" y="115">5bit</text><text x="188" y="115">4bit</text>
      <text x="222" y="115">3bit</text><text x="256" y="115">2bit</text><text x="290" y="115">1bit</text><text x="324" y="115">0bit</text>
    </g>
    <path d="M 590 86 L 345 86" stroke="#178a55" stroke-width="4" fill="none" marker-end="url(#arG)"/>
    <text x="600" y="82" font-size="13" font-weight="700" fill="#178a55">12bit左へ</text>
    <rect x="345" y="30" width="450" height="34" rx="6" fill="#e0f2e9"/>
    <text x="360" y="52" font-size="11.5" fill="#178a55">①msbを12bitシフトして、20bit幅のいちばん左(上位)へ移動</text>
  </g>

  <!-- Row 2: lsb -->
  <g>
    <text x="40" y="245" font-size="13" font-weight="700" fill="#3860c6">lsb</text>
    <rect x="70" y="220" width="32" height="32" fill="#ffffff" stroke="#3860c6" stroke-width="2"/>
    <rect x="104" y="220" width="32" height="32" fill="#ffffff" stroke="#3860c6" stroke-width="2"/>
    <rect x="138" y="220" width="32" height="32" fill="#ffffff" stroke="#3860c6" stroke-width="2"/>
    <rect x="172" y="220" width="32" height="32" fill="#ffffff" stroke="#3860c6" stroke-width="2"/>
    <rect x="206" y="220" width="32" height="32" fill="#ffffff" stroke="#3860c6" stroke-width="2"/>
    <rect x="240" y="220" width="32" height="32" fill="#ffffff" stroke="#3860c6" stroke-width="2"/>
    <rect x="274" y="220" width="32" height="32" fill="#ffffff" stroke="#3860c6" stroke-width="2"/>
    <rect x="308" y="220" width="32" height="32" fill="#ffffff" stroke="#3860c6" stroke-width="2"/>
    <g font-size="9.5" fill="#586070" text-anchor="middle">
      <text x="86" y="265">7bit</text><text x="120" y="265">6bit</text><text x="154" y="265">5bit</text><text x="188" y="265">4bit</text>
      <text x="222" y="265">3bit</text><text x="256" y="265">2bit</text><text x="290" y="265">1bit</text><text x="324" y="265">0bit</text>
    </g>
    <path d="M 460 236 L 345 236" stroke="#3860c6" stroke-width="4" fill="none" marker-end="url(#arB)"/>
    <text x="470" y="240" font-size="13" font-weight="700" fill="#3860c6">4bit左へ</text>
    <rect x="345" y="180" width="360" height="34" rx="6" fill="#e4ebfb"/>
    <text x="360" y="202" font-size="11.5" fill="#3860c6">②lsbを4bitシフトして、20bit幅の真ん中へ移動</text>
  </g>

  <!-- Row 3: xlsb (only upper 4 bits used) -->
  <g>
    <text x="40" y="395" font-size="13" font-weight="700" fill="#b9860f">xlsb</text>
    <rect x="70" y="370" width="32" height="32" fill="#f8f0dc" stroke="#b9860f" stroke-width="2"/>
    <rect x="104" y="370" width="32" height="32" fill="#f8f0dc" stroke="#b9860f" stroke-width="2"/>
    <rect x="138" y="370" width="32" height="32" fill="#f8f0dc" stroke="#b9860f" stroke-width="2"/>
    <rect x="172" y="370" width="32" height="32" fill="#f8f0dc" stroke="#b9860f" stroke-width="2"/>
    <rect x="206" y="370" width="32" height="32" fill="#f1f3f6" stroke="#c7ccd4" stroke-width="2"/>
    <rect x="240" y="370" width="32" height="32" fill="#f1f3f6" stroke="#c7ccd4" stroke-width="2"/>
    <rect x="274" y="370" width="32" height="32" fill="#f1f3f6" stroke="#c7ccd4" stroke-width="2"/>
    <rect x="308" y="370" width="32" height="32" fill="#f1f3f6" stroke="#c7ccd4" stroke-width="2"/>
    <g font-size="9.5" text-anchor="middle">
      <text x="86" y="415" fill="#586070">7bit</text><text x="120" y="415" fill="#586070">6bit</text><text x="154" y="415" fill="#586070">5bit</text><text x="188" y="415" fill="#586070">4bit</text>
      <text x="222" y="415" fill="#a8afba">3bit</text><text x="256" y="415" fill="#a8afba">2bit</text><text x="290" y="415" fill="#a8afba">1bit</text><text x="324" y="415" fill="#a8afba">0bit</text>
    </g>
    <path d="M 345 386 L 460 386" stroke="#b9860f" stroke-width="4" fill="none" marker-end="url(#arY)"/>
    <text x="470" y="390" font-size="13" font-weight="700" fill="#b9860f">4bit右へ</text>
    <rect x="345" y="330" width="380" height="34" rx="6" fill="#f8f0dc"/>
    <text x="360" y="352" font-size="11.5" fill="#b9860f">③xlsbの上位4bitだけ右シフトで取り出し、下位4bitへ移動</text>
  </g>

  <defs>
    <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#178a55"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3860c6"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9860f"/></marker>
  </defs>

  <!-- assembled 20-bit result, enclosed -->
  <text x="450" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1e25">3つを1列に並べる(合体させる)</text>

  <rect x="68" y="465" width="732" height="44" fill="none" stroke="#e07b39" stroke-width="3"/>
  <g>
    <!-- msb 8 boxes -->
    <rect x="70" y="467" width="32" height="40" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
    <rect x="104" y="467" width="32" height="40" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
    <rect x="138" y="467" width="32" height="40" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
    <rect x="172" y="467" width="32" height="40" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
    <rect x="206" y="467" width="32" height="40" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
    <rect x="240" y="467" width="32" height="40" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
    <rect x="274" y="467" width="32" height="40" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
    <rect x="308" y="467" width="32" height="40" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
    <!-- lsb 8 boxes -->
    <rect x="342" y="467" width="32" height="40" fill="#e4ebfb" stroke="#3860c6" stroke-width="1.5"/>
    <rect x="376" y="467" width="32" height="40" fill="#e4ebfb" stroke="#3860c6" stroke-width="1.5"/>
    <rect x="410" y="467" width="32" height="40" fill="#e4ebfb" stroke="#3860c6" stroke-width="1.5"/>
    <rect x="444" y="467" width="32" height="40" fill="#e4ebfb" stroke="#3860c6" stroke-width="1.5"/>
    <rect x="478" y="467" width="32" height="40" fill="#e4ebfb" stroke="#3860c6" stroke-width="1.5"/>
    <rect x="512" y="467" width="32" height="40" fill="#e4ebfb" stroke="#3860c6" stroke-width="1.5"/>
    <rect x="546" y="467" width="32" height="40" fill="#e4ebfb" stroke="#3860c6" stroke-width="1.5"/>
    <rect x="580" y="467" width="32" height="40" fill="#e4ebfb" stroke="#3860c6" stroke-width="1.5"/>
    <!-- xlsb used 4 boxes -->
    <rect x="614" y="467" width="32" height="40" fill="#f8f0dc" stroke="#b9860f" stroke-width="1.5"/>
    <rect x="648" y="467" width="32" height="40" fill="#f8f0dc" stroke="#b9860f" stroke-width="1.5"/>
    <rect x="682" y="467" width="32" height="40" fill="#f8f0dc" stroke="#b9860f" stroke-width="1.5"/>
    <rect x="716" y="467" width="32" height="40" fill="#f8f0dc" stroke="#b9860f" stroke-width="1.5"/>
    <!-- unused 4 boxes -->
    <rect x="750" y="467" width="48" height="40" fill="#e2e5ea" stroke="#98a0ad" stroke-width="1.5"/>
    <text x="774" y="491" text-anchor="middle" font-size="9.5" fill="#586070">未使用</text>
  </g>

  <text x="204" y="524" text-anchor="middle" font-size="11" fill="#178a55" font-weight="700">msb由来(上位8bit)</text>
  <text x="461" y="524" text-anchor="middle" font-size="11" fill="#3860c6" font-weight="700">lsb由来(中位8bit)</text>
  <text x="681" y="524" text-anchor="middle" font-size="11" fill="#b9860f" font-weight="700">xlsb由来(下位4bit)</text>

  <!-- speech bubble -->
  <path d="M 100 590 h 340 a 10 10 0 0 1 10 10 v 24 a 10 10 0 0 1 -10 10 h -260 l -30 22 l 6 -22 h -56 a 10 10 0 0 1 -10 -10 v -24 a 10 10 0 0 1 10 -10 z" fill="#ebe4f8" stroke="#6a4dbd" stroke-width="2"/>
  <text x="270" y="616" text-anchor="middle" font-size="15" font-weight="700" fill="#6a4dbd">これで20bitの「生の値」が取得できる！</text>
</svg>
