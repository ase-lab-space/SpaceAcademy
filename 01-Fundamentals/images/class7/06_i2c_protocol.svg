<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e25">I2Cの通信イメージ:2本の線に複数の相手がぶら下がる</text>

  <!-- shared bus -->
  <rect x="40" y="50" width="560" height="70" rx="8" fill="#e4ebfb" stroke="#3860c6" stroke-width="2.5"/>
  <text x="320" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#3860c6">Pico W(マスター)</text>
  <text x="320" y="95" text-anchor="middle" font-size="11" fill="#3860c6">SDA(データ)・SCL(クロック)の2本だけを共有</text>

  <line x1="150" y1="120" x2="150" y2="170" stroke="#1b1e25" stroke-width="2"/>
  <line x1="320" y1="120" x2="320" y2="170" stroke="#1b1e25" stroke-width="2"/>
  <line x1="490" y1="120" x2="490" y2="170" stroke="#1b1e25" stroke-width="2"/>

  <rect x="90" y="170" width="120" height="55" rx="6" fill="#e0f2e9" stroke="#178a55" stroke-width="2"/>
  <text x="150" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#178a55">BME280</text>
  <text x="150" y="212" text-anchor="middle" font-size="11" fill="#178a55">0x76</text>

  <rect x="260" y="170" width="120" height="55" rx="6" fill="#f6ecda" stroke="#a9640f" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#a9640f">他のセンサ</text>
  <text x="320" y="212" text-anchor="middle" font-size="11" fill="#a9640f">0x5A(例)</text>

  <rect x="430" y="170" width="120" height="55" rx="6" fill="#ebe4f8" stroke="#6a4dbd" stroke-width="2"/>
  <text x="490" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#6a4dbd">また別の機器</text>
  <text x="490" y="212" text-anchor="middle" font-size="11" fill="#6a4dbd">0x68(例)</text>

  <text x="320" y="255" text-anchor="middle" font-size="12" fill="#1b1e25">SPIのように機器ごとの専用線(CS)は無い。代わりに、各機器が固有の**アドレス**を持つ</text>

  <!-- transaction sequence -->
  <rect x="60" y="275" width="90" height="34" fill="#ffffff" stroke="#1b1e25" stroke-width="1.5"/>
  <text x="105" y="296" text-anchor="middle" font-size="11">スタート</text>
  <rect x="160" y="275" width="120" height="34" fill="#e0f2e9" stroke="#178a55" stroke-width="1.5"/>
  <text x="220" y="296" text-anchor="middle" font-size="11" fill="#178a55">アドレス0x76+R/W</text>
  <rect x="290" y="275" width="70" height="34" fill="#f8f0dc" stroke="#b9860f" stroke-width="1.5"/>
  <text x="325" y="296" text-anchor="middle" font-size="11" fill="#b9860f">ACK</text>
  <rect x="370" y="275" width="90" height="34" fill="#e4ebfb" stroke="#3860c6" stroke-width="1.5"/>
  <text x="415" y="296" text-anchor="middle" font-size="11" fill="#3860c6">データ</text>
  <rect x="470" y="275" width="70" height="34" fill="#f8f0dc" stroke="#b9860f" stroke-width="1.5"/>
  <text x="505" y="296" text-anchor="middle" font-size="11" fill="#b9860f">ACK</text>
  <rect x="550" y="275" width="70" height="34" fill="#ffffff" stroke="#1b1e25" stroke-width="1.5"/>
  <text x="585" y="296" text-anchor="middle" font-size="11">ストップ</text>

  <text x="320" y="335" text-anchor="middle" font-size="12" fill="#1b1e25" font-weight="700">「0x76さん、いますか?」→ ACK(応答)が返ってきた相手とだけ、そのままデータをやり取りする</text>
  <text x="320" y="358" text-anchor="middle" font-size="11.5" fill="#586070">ACKが返らなければ「その番地に相手がいない」ことが分かる(配線ミスやアドレス間違いの検知に使える)</text>
</svg>
